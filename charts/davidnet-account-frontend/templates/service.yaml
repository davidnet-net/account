apiVersion: v1
kind: Service
metadata:
  name: { { include "account-frontend.fullname" . } }
spec:
  type: { { .Values.service.type } }
  ports:
    - port: { { .Values.service.port } }
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: { { include "account-frontend.name" . } }
